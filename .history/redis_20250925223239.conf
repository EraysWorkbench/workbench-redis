# --- Security / binding ---
protected-mode yes
bind 0.0.0.0
port 6379

# --- Authentication (optional) ---
# Uncomment to require a password. Also set REDIS_PASSWORD in .env and add
# "requirepass ${REDIS_PASSWORD}" below (envsubst not used here).
# requirepass yourStrongPasswordHere

# --- Persistence ---
appendonly yes
appendfilename "appendonly.aof"
# fsync every second: safer than 'no', faster than 'always'
appendfsync everysec

# Optional RDB snapshots (dev-friendly defaults)
save 900 1
save 300 10
save 60 10000

# --- Memory policy (dev-friendly) ---
maxmemory 256mb
maxmemory-policy allkeys-lru

# --- Logging ---
loglevel notice
